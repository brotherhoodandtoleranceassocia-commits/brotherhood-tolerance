<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>عارض كود موقع جمعية الأخوة والتسامح</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#101820;color:#e8eef2;font-family:Tahoma,Arial,sans-serif}
header{padding:18px;background:#176b50;color:white}
h1{font-size:20px;margin:0 0 8px}
p{margin:6px 0;line-height:1.7}
.actions{display:flex;gap:10px;flex-wrap:wrap;padding:14px}
button{border:0;border-radius:8px;padding:11px 16px;background:#e6b85c;color:#17231e;font-weight:bold}
#status{padding:0 14px;color:#c9d7df}
pre{direction:ltr;text-align:left;white-space:pre;overflow:auto;margin:14px;padding:16px;background:#071018;border:1px solid #30424e;border-radius:10px;line-height:1.55;font:13px/1.55 Consolas,Monaco,monospace;tab-size:2}
.tag{color:#ff8f8f}.attr{color:#ffd479}.str{color:#a8e6a1}.comment{color:#8296a5;font-style:italic}.kw{color:#d5a6ff}.plain{color:#e8eef2}
</style>
</head>
<body>
<header>
<h1>كود موقع جمعية الأخوة والتسامح للعمل الخيري</h1>
<p>عارض ملوّن للقراءة والنسخ. يعرض ملف index.html الحالي من مستودع GitHub ولا يغيّر الموقع.</p>
</header>
<div class="actions">
<button onclick="copyCode()">نسخ الكود كاملاً</button>
<button onclick="loadCode()">إعادة تحميل الكود</button>
</div>
<div id="status">جارٍ تحميل ملف الموقع الأصلي...</div>
<pre><code id="code"></code></pre>
<script>
const sourceURL="https://raw.githubusercontent.com/brotherhoodandtoleranceassocia-commits/brotherhood-tolerance/main/index.html";
let source="";
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function highlight(s){
  let out=esc(s);
  out=out.replace(/(&lt;!--[\s\S]*?--&gt;)/g,'<span class="comment">$1</span>');
  out=out.replace(/(&lt;\/?[a-zA-Z][\w:-]*)/g,'<span class="tag">$1</span>');
  out=out.replace(/(\s[\w:-]+)(=)/g,'<span class="attr">$1</span>$2');
  out=out.replace(/(&quot;.*?&quot;)/g,'<span class="str">$1</span>');
  out=out.replace(/\b(const|let|var|function|return|if|else|new|true|false|null)\b/g,'<span class="kw">$1</span>');
  return out;
}
async function loadCode(){
 const status=document.getElementById("status");
 status.textContent="جارٍ تحميل الكود...";
 try{
  const r=await fetch(sourceURL,{cache:"no-store"});
  if(!r.ok) throw new Error("HTTP "+r.status);
  source=await r.text();
  document.getElementById("code").innerHTML=highlight(source);
  status.textContent="تم تحميل الكود الأصلي. عدد الأسطر: "+source.split("\n").length;
 }catch(e){status.textContent="تعذّر تحميل الكود. تأكد من اتصال الإنترنت ثم اضغط إعادة تحميل الكود.";}
}
async function copyCode(){
 if(!source){alert("انتظر حتى يتم تحميل الكود أولاً.");return;}
 try{await navigator.clipboard.writeText(source);alert("تم نسخ الكود كاملاً.");}
 catch(e){
  const t=document.createElement("textarea");t.value=source;document.body.appendChild(t);t.select();
  document.execCommand("copy");t.remove();alert("تم النسخ.");
 }
}
loadCode();
</script>
</body>
</html>
